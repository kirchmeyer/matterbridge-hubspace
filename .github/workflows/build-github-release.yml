name: Build GitHub release

on:
  release:
    types: [created]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Verify release version
        run: test "v$(node -p "require('./package.json').version")" = "${{ github.event.release.tag_name }}"
      - name: Build package
        run: npm run package
      - name: Attach package to release
        run: gh release upload "${{ github.event.release.tag_name }}" matterbridge-hubspace-*.tgz --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish package
        run: npm publish matterbridge-hubspace-*.tgz --tag ${{ github.event.release.prerelease && 'preview' || 'latest' }}
