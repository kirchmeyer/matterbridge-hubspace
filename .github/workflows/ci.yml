name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Audit runtime dependencies
        run: npm audit --omit=dev
      - name: Build release package
        run: node scripts/package.mjs
      - name: Verify production manifest
        run: |
          if tar -xOf matterbridge-hubspace-*.tgz package/package.json | grep -q 'devDependencies'; then
            echo 'Release package must not contain devDependencies.'
            exit 1
          fi
